[project]
name = "websocket-tunnel"
dynamic = ["version"]
description = "A frp-like intranet penetration tool with WebSocket transport (TCP passthrough)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "websockets>=14",
]

[project.scripts]
wtunnel = "websocket_tunnel.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/websocket_tunnel/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/websocket_tunnel"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "trustme>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
