name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs for testing the pipeline

permissions:
  contents: read
  # Trusted publishing (OIDC) needs the id-token permission. If you prefer an
  # API token instead, remove this line, add the PYPI_TOKEN secret and pass it
  # to the publish step via env: UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive version from git tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish
